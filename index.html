<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1eb">
  <meta name="description" content="DesignFlow — канбан-планировщик для творческих проектов.">
  <title>DesignFlow — планировщик творческих проектов</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/data.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">К доске задач</a>
  <aside class="sidebar" aria-label="Проекты">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✿</span><div><strong>DesignFlow</strong><small>Планировщик для дизайнеров</small></div></div>
    <div class="project-heading"><h2>Проекты</h2><button class="icon" id="new-project" type="button" aria-label="Добавить проект" title="Добавить проект">+</button></div>
    <nav id="projects" aria-label="Выбор проекта"></nav>
    <div class="local-note"><span aria-hidden="true">◌</span> Данные хранятся в этом браузере</div>
  </aside>
  <main id="main">
    <header class="hero">
      <div class="hero-text"><h1 id="board-title">Доска задач</h1><p id="progress-text"></p><progress id="progress" aria-label="Выполнение задач" value="0" max="1"></progress></div>
      <button class="primary" id="new-task" type="button">＋ Новая задача</button>
    </header>
    <section aria-label="Фильтры задач" class="toolbar">
      <label class="search"><span>Поиск</span><input id="search" type="search" placeholder="Название или описание"></label>
      <label>Приоритет<select id="priority-filter"><option value="">Любой</option><option value="high">Высокий</option><option value="medium">Средний</option><option value="low">Низкий</option></select></label>
      <label>Срок<select id="deadline-filter"><option value="">Любой</option><option value="overdue">Просрочен</option><option value="today">Сегодня</option><option value="upcoming">После сегодня</option><option value="none">Без срока</option></select></label>
      <button id="reset-filters" class="secondary" type="button" hidden>Сбросить</button>
    </section>
    <p id="storage-error" class="notice" role="alert" hidden></p>
    <p id="announcement" class="sr-only" role="status"></p>
    <section class="board" id="board" aria-label="Канбан-доска"></section>
  </main>
  <dialog id="task-dialog" aria-labelledby="task-dialog-title">
    <h2 id="task-dialog-title">Новая задача</h2>
    <form id="task-form">
      <label>Название<input name="title" maxlength="100" required autofocus></label>
      <label>Описание<textarea name="description" maxlength="1000" rows="3"></textarea></label>
      <div class="fields">
        <label>Проект<select name="projectId" id="task-project"></select></label>
        <label>Статус<select name="status" id="task-status"></select></label>
        <label>Приоритет<select name="priority" id="task-priority"></select></label>
        <label>Срок<input type="date" name="due" max="9999-12-31"></label>
      </div>
      <div class="actions">
        <button class="danger" id="delete-task" type="button">Удалить</button>
        <button class="secondary" type="button" data-close>Отмена</button>
        <button class="primary" type="submit">Сохранить</button>
      </div>
    </form>
  </dialog>
  <dialog id="project-dialog" aria-labelledby="project-dialog-title">
    <h2 id="project-dialog-title">Новый проект</h2>
    <form id="project-form">
      <label>Название<input name="name" maxlength="60" required autofocus></label>
      <label>Цвет<select name="color">
        <option value="rose">Пыльная роза</option>
        <option value="sage">Шалфей</option>
        <option value="clay">Терракота</option>
        <option value="sand">Песочный</option>
      </select></label>
      <div class="actions">
        <button class="danger" id="delete-project" type="button">Удалить</button>
        <button class="secondary" type="button" data-close>Отмена</button>
        <button class="primary" type="submit">Сохранить</button>
      </div>
    </form>
  </dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <h2 id="confirm-title">Подтвердить удаление</h2>
    <p id="confirm-text"></p>
    <form method="dialog">
      <div class="actions">
        <button class="secondary" value="cancel" autofocus>Отмена</button>
        <button class="danger" value="delete">Удалить</button>
      </div>
    </form>
  </dialog>
</body>
</html>
